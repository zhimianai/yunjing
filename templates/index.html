<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云镜 - 智能问答 + 人脸识别</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260919c">
</head>
<body>
    <div class="container">
        <!-- 侧边栏-->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>云镜</h1>
                <div class="sidebar-header-actions">
                    <button id="searchBtn" class="btn-icon" title="搜索">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button id="multiSelectBtn" class="btn-icon" title="多选">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3h18v18H3z"></path>
                            <path d="M9 3v18"></path>
                            <path d="M15 3v18"></path>
                            <path d="M3 9h18"></path>
                            <path d="M3 15h18"></path>
                        </svg>
                    </button>
                    <button id="collapseBtn" class="btn-icon" title="收起边栏">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>
                    <button id="configBtn" class="btn-icon" title="设置">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="sidebar-search" id="sidebarSearch" style="display:none">
                <input type="text" id="searchInput" placeholder="搜索对话...">
            </div>
            
            <div class="multi-select-actions" id="multiSelectActions">
                <button class="btn-cancel" id="cancelMultiSelect">取消</button>
                <button class="btn-delete" id="deleteSelected">删除选中</button>
            </div>
            
            <div class="sidebar-content">
                <div class="search-toggle">
                    <label class="toggle-switch">
                        <input type="checkbox" id="searchToggle">
                        <span class="slider"></span>
                    </label>
                    <span>网络搜索</span>
                </div>
                
                <button id="newChatBtn" class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    新对话
                </button>
                
                <div class="history-section">
                    <div class="history-header">
                        <span>历史对话</span>
                    </div>
                    <div class="history-list" id="historyList">
                        <!-- 历史对话列表将在这里动态加载 -->
                    </div>
                </div>
                
                <button id="clearHistoryBtn" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    清空历史
                </button>

                <a href="https://wenxin.baidu.com/" target="_blank" class="btn-secondary btn-link" title="打开百度文心官网">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    百度文心官网
                </a>
            </div>
            
            <div class="sidebar-footer">
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot"></span>
                    <span class="status-text">未配置</span>
                </div>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <div class="chat-container" id="chatContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <h2>云镜</h2>
                    <p>可以直接把图片、文件拖到输入框，或 Ctrl+V 粘贴图片</p>
                </div>
                
                <div class="messages" id="messages"></div>
            </div>
            
            <div class="input-container">
                <div class="attachments-bar" id="attachmentsBar" style="display:none"></div>
                
                <div class="input-wrapper" id="inputWrapper">
                    <div class="input-left-tools">
                        <button type="button" id="attachBtn" class="btn-attach" title="添加附件（图片或文件）">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                        </button>
                        <button type="button" id="genImgBtn" class="btn-attach btn-img-gen" title="图片生成">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </button>
                        <button type="button" id="faceRecBtn" class="btn-attach btn-face-rec" title="人脸识别">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12h.01M15 12h.01"></path>
                                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                                <circle cx="12" cy="12" r="4"></circle>
                            </svg>
                        </button>
                        <input type="file" id="fileAttachInput" multiple style="display:none">
                        <input type="file" id="faceRecInput" accept="image/*" style="display:none">
                    </div>
                    
                    <textarea 
                        id="messageInput" 
                        placeholder="输入问题，或粘贴图片 / 拖拽文件..." 
                        rows="1"
                    ></textarea>
                    
                    <div class="input-right-tools">
                        <button type="button" id="stopBtn" class="btn-stop" style="display:none" title="停止生成">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="6" y="6" width="12" height="12"></rect>
                            </svg>
                        </button>
                        <button type="button" id="sendBtn" class="btn-send" disabled title="发送">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="drop-hint" id="dropHint" style="display:none">
                    松开鼠标即可上传
                </div>
            </div>
        </div>
    </div>
    
    <!-- 配置弹窗 -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>配置设置</h2>
                <button class="btn-close" id="closeConfigBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label for="providerSelect">AI服务提供商</label>
                    <select id="providerSelect">
                        <option value="deepseek">DeepSeek</option>
                        <option value="qwen">通义千问</option>
                        <option value="wenxin">百度文心助手</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="modelSelect">模型名称</label>
                    <select id="modelSelect"></select>
                </div>
                
                <div class="form-group">
                    <label for="apiKeyInput">API Key / Access Token</label>
                    <input type="password" id="apiKeyInput" placeholder="输入API Key">
                </div>
                
                <div class="form-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="enableSearchConfig">
                        <span class="slider"></span>
                    </label>
                    <span>启用网络搜索</span>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelConfigBtn">取消</button>
                <button class="btn-primary" id="saveConfigBtn">保存配置</button>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}?v=20260919c"></script>
</body>
</html>
