services:
  - type: web
    name: zhimianai
    env: python
    region: singapore
    plan: free
    buildCommand: grep -v "^tensorflow\|^protobuf" requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0 $PORT --timeout 120 --preload --workers 1 --max-requests 50
    healthCheckPath: /
    envVars:
      - key: CUDA_VISIBLE_DEVICES
        value: ""
      - key: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: "python"