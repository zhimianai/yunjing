services:
  - type: web
    name: zhimianai
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ai智能问答:app --bind 0.0.0.0 $PORT --timeout 120
    healthCheckPath: /
    envVars:
      - key: CUDA_VISIBLE_DEVICES
        value: ""
